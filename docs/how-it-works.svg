<svg xmlns="http://www.w3.org/2000/svg" width="960" height="866" viewBox="0 0 960 866" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
<title id="t">How Plutus works</title>
<desc id="d">How Plutus works, in four steps, all on your Mac. 1, your files: card statements (PDF, CSV or Excel), UPI app history (PhonePe, CRED, Google Pay) and UPI screenshots. 2, read: identify each file with quick checks, get its text, read its rows, and count a card statement only if it adds up to the paisa, else hold it for you. 3, make sense: one ledger with each payment once; categories from your answers, rules, known shops and the local AI; card bills placed in their cycle so nothing is counted twice. 4, see and ask: the dashboard, and Ask Plutus, which does the maths itself. The optional local AI only helps where the rules aren&#x27;t sure, and never does the sums.</desc>
