# Every push and pull request: the backend's tests, the dashboard's money checks, the TypeScript check and a build.
# The repo holds code and generated fake statements only; the backend's tests also refuse any non-loopback connection.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15 # Apple's on-device OCR (Vision) and the macOS system fonts are part of what's tested
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install the backend
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -q --upgrade pip
          backend/.venv/bin/python -m pip install -q -e 'backend[dev]'
      - name: Backend tests
        working-directory: backend
        run: .venv/bin/python -m pytest -q

      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install the web app
        working-directory: web
        run: |
          npm install -g pnpm@12
          pnpm install --frozen-lockfile
      - name: Dashboard tests, types and build
        working-directory: web
        run: |
          pnpm test
          pnpm typecheck
          pnpm build
